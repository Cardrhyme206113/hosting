name: Publish BlockHost runtime

on:
  push:
    branches: [publish-blockhost-runtime-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 userspace emulator for runtime preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Download and repair BlockHost runtime
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e674-720a-a409-fb4f7e52b2c4/raw?se=2026-06-30T19:44:30Z&sp=r&sv=2026-02-06&sr=b&scid=86bb33cd-dcc7-586d-80cc-f72dc3756981&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-06-30T04:37:15Z&ske=2026-07-02T04:37:15Z&sks=b&skv=2026-02-06&sig=AP6gKcdXXBgJ6S7fmOPZAYcdNq/pie1Mw7jK8ZZiP/I%3D' \
            -o artifact.zip
          mkdir artifact rootfs
          unzip -q artifact.zip -d artifact
          apk=$(find artifact -type f -name '*.apk' | head -n1)
          test -n "$apk"
          unzip -p "$apk" assets/runtime-aarch64.tar > runtime-aarch64.tar
          test "$(stat -c%s runtime-aarch64.tar)" -gt 500000000
          tar -xf runtime-aarch64.tar -C rootfs

          # apk.static was intentionally run with --no-scripts when the ARM64
          # filesystem was assembled. Recreate the essential post-install work:
          # BusyBox applet links and Java's default-jvm link.
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo chroot rootfs /bin/busybox mkdir -p /bin /sbin /usr/bin /usr/sbin /dev
          sudo chroot rootfs /bin/busybox --install -s
          sudo ln -sfn java-21-openjdk rootfs/usr/lib/jvm/default-jvm

          # /dev is supplied by PRoot on Android. Make a temporary null device
          # only for CI validation, then remove it before publishing.
          sudo mknod rootfs/dev/null c 1 3
          sudo chmod 666 rootfs/dev/null

          sudo chroot rootfs /bin/bash --version
          sudo chroot rootfs /usr/bin/java -version
          sudo chroot rootfs /usr/lib/jvm/java-17-openjdk/bin/java -version
          sudo chroot rootfs /usr/bin/git --version
          sudo chroot rootfs /usr/bin/mvn -version

          sudo rm -f rootfs/usr/bin/qemu-aarch64-static rootfs/dev/null
          rm -f runtime-aarch64.tar
          tar --numeric-owner --owner=0 --group=0 --format=posix -C rootfs -cf runtime-aarch64.tar .
          gzip -6 runtime-aarch64.tar
          sha256sum runtime-aarch64.tar.gz | awk '{print $1}' > runtime-aarch64.tar.gz.sha256
          ls -lh runtime-aarch64.tar.gz runtime-aarch64.tar.gz.sha256

      - name: Publish public runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          tag=blockhost-runtime-v1
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title 'BlockHost ARM64 Runtime v1' --notes 'Prebuilt Alpine ARM64 runtime with Java 17/21, Git and Maven for BlockHost.'
          gh release upload "$tag" runtime-aarch64.tar.gz runtime-aarch64.tar.gz.sha256 --clobber
